plugins {
    id 'com.android.application'
    id 'org.ajoberstar.grgit' version '5.3.3'
}
// these are from MojoLauncher
static def getDate() { return new Date().format('yyyyMMdd') }
static def getDateSeconds() { if (System.getenv("GITHUB_ACTIONS") == "true") { return Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER")); } else { return 172005; } }
def getVersionName = { def currentBranch = grgit.branch.current(); def latestCommit = grgit.log(maxCommits: 1); def dateToday = getDate(); if(currentBranch == null || latestCommit == null) { return "LOCAL-${dateToday}" }else { def branchName = currentBranch.getName(); def commitAbbreviation = latestCommit.abbreviatedId; return "${dateToday}-${commitAbbreviation}-${branchName}"; } }
// 
android {
    namespace 'a.b'
    compileSdk 33

    defaultConfig {
        applicationId "io.github.aegires"
        minSdk 24
        targetSdk 33
        versionCode getDateSeconds()
        versionName getVersionName()
        multiDexEnabled false
    }
    
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('config/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        debugr8 {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.conscrypt:conscrypt-android:2.6.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}