name: Android CI

on:
  push:
    branches:
      - 'gen3'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebugr8

      - uses: actions/upload-artifact@v6
        with:
          name: apk-arm64-v8a
          path: app/build/outputs/apk/debugr8/*arm64-v8a*.apk

      - uses: actions/upload-artifact@v6
        with:
          name: apk-armeabi-v7a
          path: app/build/outputs/apk/debugr8/*armeabi-v7a*.apk

      - uses: actions/upload-artifact@v6
        with:
          name: apk-x86_64
          path: app/build/outputs/apk/debugr8/*x86_64*.apk